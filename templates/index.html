<!DOCTYPE html>
<html>
<head>

<title>Supply Chain Delay Prediction</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f8;
    text-align:center;
}

.container{
    width:420px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;
    background:#007BFF;
    border:none;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

</style>

</head>


<body>

<div class="container">

<h2>Supply Chain Delay Predictor</h2>

<form id="predictForm">

<select id="Type">
<option value="DEBIT">DEBIT</option>
<option value="TRANSFER">TRANSFER</option>
<option value="CASH">CASH</option>
<option value="PAYMENT">PAYMENT</option>
</select>

<input type="number" id="Sales" placeholder="Sales" required>

<input type="number" id="Quantity" placeholder="Order Item Quantity" required>

<input type="number" id="Days" placeholder="Days for Shipping Scheduled" required>


<select id="ShippingMode">

<option value="Standard Class">Standard Class</option>
<option value="Second Class">Second Class</option>
<option value="First Class">First Class</option>
<option value="Same Day">Same Day</option>

</select>


<input type="text" id="Region" placeholder="Order Region (e.g. Western Europe)" required>

<input type="text" id="Market" placeholder="Market (e.g. Europe)" required>


<button type="submit">Predict</button>

</form>

<div id="result"></div>

</div>


<script>

document.getElementById("predictForm").addEventListener("submit", async function(e){

e.preventDefault()

let data = {

Type: document.getElementById("Type").value,
Sales: parseFloat(document.getElementById("Sales").value),
"Order.Item.Quantity": parseInt(document.getElementById("Quantity").value),
"Days.for.shipping.scheduled": parseInt(document.getElementById("Days").value),
"Shipping.Mode": document.getElementById("ShippingMode").value,
"Order.Region": document.getElementById("Region").value,
"Market": document.getElementById("Market").value

}

let response = await fetch("/predict",{

method:"POST",
headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

})

let result = await response.json()

document.getElementById("result").innerText = result.prediction

})

</script>

</body>
</html>
